  <!-- Bow tie -->
  <path d="M32 55.5 L24.5 51.5 L24.5 59.5 Z M32 55.5 L39.5 51.5 L39.5 59.5 Z" fill="#14161b"/>
  <circle cx="32" cy="55.5" r="2" fill="#14161b"/>
