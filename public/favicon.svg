<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AIMAF: a robot in a mafia fedora -->
  <rect width="64" height="64" rx="14" fill="#c62828"/>

  <!-- Robot head -->
  <rect x="11" y="33" width="5" height="9" rx="2.5" fill="#9aa5b4"/>
  <rect x="48" y="33" width="5" height="9" rx="2.5" fill="#9aa5b4"/>
  <rect x="15" y="24" width="34" height="27" rx="8" fill="#e6ebf2"/>

  <!-- Visor with glowing eyes -->
  <rect x="19" y="31" width="26" height="11" rx="5.5" fill="#14161b"/>
  <circle cx="26.5" cy="36.5" r="3" fill="#61dafb"/>
  <circle cx="37.5" cy="36.5" r="3" fill="#61dafb"/>

  <!-- Mouth -->
  <rect x="27" y="45" width="10" height="2.4" rx="1.2" fill="#7c8696"/>

  <!-- Fedora -->
