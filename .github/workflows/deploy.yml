name: Deploy to Cloudflare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Without this the runner reuses its cached 24.x, which lags the
          # latest patch release and can sit below the security floor.
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Yarn
        run: corepack prepare yarn@4.11.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The site is served from the root of aimaf.flopbut.pl, so the public
      # path comes from `homepage` in package.json and no PUBLIC_URL is needed.
      - name: Build
        run: yarn build
        env:
          DISABLE_ESLINT_PLUGIN: true

      # Uploads build/ as static assets of the `aimaf` Worker (wrangler.jsonc).
      - name: Deploy to Cloudflare
        run: yarn wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
